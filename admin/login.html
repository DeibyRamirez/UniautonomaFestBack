<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — Admin Fest 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="pagina-login">
  <div class="contenedor-login">
    <div class="tarjeta tarjeta-login">
      <form id="formulario-login">
        <p class="etiqueta">Panel administrativo</p>
        <h1>Iniciar sesión</h1>
        <p class="login-aviso-seguridad">Las credenciales no se guardan en esta página. Solo se validan con Firebase Auth.</p>
        <div class="campo">
          <label for="correo">Correo</label>
          <input id="correo" name="correo" type="email" autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <div class="campo-contrasena">
            <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required>
            <button type="button" id="boton-ver-contrasena" class="boton-ver-contrasena" aria-pressed="false" aria-label="Mostrar contraseña">Ver</button>
          </div>
        </div>
        <p id="error-login" class="error" role="alert" hidden></p>
        <button type="submit" class="boton-principal" id="boton-entrar">Entrar</button>
      </form>

      <div id="estado-login-exitoso" class="estado-login-exitoso" hidden aria-live="polite">
        <p class="estado-login-exitoso__icono" aria-hidden="true">✓</p>
        <p class="etiqueta">Acceso correcto</p>
        <h2 class="estado-login-exitoso__titulo">Credenciales correctas</h2>
        <p id="texto-login-exitoso-correo" class="estado-login-exitoso__texto"></p>
        <p class="estado-login-exitoso__ayuda">Redirigiendo al panel…</p>
      </div>
    </div>
    <p class="login-enlace-volver"><a href="/">← Volver al sitio del Fest</a></p>
  </div>
  <script src="js/login.js" type="module"></script>
</body>
</html>
