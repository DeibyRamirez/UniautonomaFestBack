# Integración continua — Gitflow (feature/release/hotfix → develop/main)
name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar-backend:
    name: Verificar backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis
        run: npm run verify

  verificar-api-vercel:
    name: Entrada serverless Vercel
    runs-on: ubuntu-latest
    needs: verificar-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias raíz
        run: npm ci

      - name: Comprobar api/index.js
        run: node --check api/index.js

  reglas-firestore:
    name: Reglas Firestore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar ficheros Firebase
        run: |
          test -f firebase/firestore.rules
          test -f firebase.json
          grep -q "rules_version" firebase/firestore.rules
